[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabicl-mcp"
version = "0.2.0"
description = "MCP server for TabICL — in-context tabular ML (classify, regress, explain, report) for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gioia Blayer", email = "gioia.blayer@gmail.com" }]
keywords = ["mcp", "tabicl", "tabular", "machine-learning", "llm", "agents"]

dependencies = [
    "mcp>=2.0.0",
    "tabicl>=2.1",
    "scikit-learn>=1.4.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
# stdio  →  for Claude Desktop, Cursor, VS Code, Claude Code
tabicl-mcp       = "tabicl_mcp.server:serve_stdio"
# Streamable HTTP  →  for claude.ai, ChatGPT, Gemini, HF Spaces
tabicl-mcp-http  = "tabicl_mcp.server:serve_http"

[project.urls]
Homepage   = "https://github.com/gblayer/tabicl-mcp"
Repository = "https://github.com/gblayer/tabicl-mcp"

[tool.hatch.build.targets.wheel]
packages = ["tabicl_mcp"]

[tool.pytest.ini_options]
markers = ["slow: tests that fit the real TabICL model (download/loads checkpoints)"]
